<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vegetable POS - Starting...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            width: 480px;
            height: 320px;
            background: linear-gradient(135deg, #064e3b 0%, #042f2e 50%, #022c22 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .bg-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 16px 16px;
            pointer-events: none;
        }
        .logo-wrap {
            position: relative;
            width: 72px;
            height: 72px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-glow {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 18px;
            background: #10b981;
            filter: blur(14px);
            opacity: 0.45;
            animation: pulse-glow 2s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.35; transform: scale(0.95); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .logo-svg {
            position: relative;
            width: 68px;
            height: 68px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 4px;
            text-align: center;
        }
        .subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #6ee7b7;
            font-weight: 600;
            margin-bottom: 22px;
            opacity: 0.9;
        }
        .progress-track {
            width: 100%;
            max-width: 340px;
            height: 5px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, #34d399, #6ee7b7);
            border-radius: 999px;
            animation: load 2.5s ease-out forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            30% { width: 45%; }
            70% { width: 85%; }
            100% { width: 100%; }
        }
        .status-text {
            font-size: 12px;
            color: #d1fae5;
            font-weight: 500;
            min-height: 16px;
        }
        .badge {
            position: absolute;
            bottom: 12px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <div class="logo-wrap">
        <div class="logo-glow"></div>
        <svg class="logo-svg" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="128" height="128" rx="28" fill="#166534" />
            <path d="M30 32 L53 96 H75 L98 32 H80 L64 77 L48 32 Z" fill="#ffffff" />
        </svg>
    </div>

    <div class="title">Vegetable POS</div>
    <div class="subtitle">Offline Desktop POS • 2026</div>

    <div class="progress-track">
        <div class="progress-bar"></div>
    </div>

    <div class="status-text" id="statusMsg">Starting offline database engine...</div>

    <div class="badge">v1.0.0 • SQLite WAL Protected</div>

    <script>
        const statusMsg = document.getElementById('statusMsg');
        const steps = [
            { time: 400, text: "Verifying database integrity..." },
            { time: 1000, text: "Initializing local services..." },
            { time: 1800, text: "Loading Vegetable POS Interface..." },
            { time: 2300, text: "Ready!" }
        ];
        steps.forEach(s => {
            setTimeout(() => {
                if (statusMsg) statusMsg.textContent = s.text;
            }, s.time);
        });
    </script>
</body>
</html>
